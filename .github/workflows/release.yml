name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests y compilación
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tv-mundo.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/tv-mundo-${VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: tv-mundo-${{ env.VERSION }}
          path: dist/tv-mundo-${{ env.VERSION }}.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/tv-mundo.apk "dist/tv-mundo-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "TV Mundo $VERSION" \
            --notes "APK compilado automáticamente desde ${GITHUB_SHA::7}. Descarga **tv-mundo.apk** e instálalo en la TV (ver README)." \
            --latest
